services:
  cook:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      AUTH_MODE: google
      API_BIND: 127.0.0.1:8081
      DATABASE_URL: sqlite:///data/cook.db
      PUBLIC_ORIGIN: https://cook.vichare.net
    volumes:
      - cook-data:/data
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cook-data:
