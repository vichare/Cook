openapi: 3.1.0
info:
  title: Cook API
  version: 0.6.0
servers:
  - url: https://cook.vichare.net
paths:
  /health:
    get:
      responses:
        "200": { description: Healthy }
  /api/me:
    get:
      responses:
        "200":
          description: Current Cook user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/profile:
    put:
      description: Updates the authenticated user's opt-in public nickname and completes profile onboarding. A null nickname is the locale-independent anonymous state.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated private current-user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: JSON shape contains unsupported or invalid fields }
  /api/settings/locale:
    put:
      description: Persists the authenticated account's authoritative interface locale. New and migrated accounts may initially return null so the browser can initialize this once from the saved local preference or browser languages.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocaleInput" }
      responses:
        "200":
          description: Updated private current-user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/config:
    get:
      responses:
        "200":
          description: Available browser sign-in mode
          content:
            application/json:
              schema:
                type: object
                required: [mode, google, emailOtp, passkey]
                properties:
                  mode: { type: string, enum: [development, production] }
                  google: { type: boolean }
                  emailOtp: { type: boolean }
                  passkey: { type: boolean }
  /api/auth/dev-login:
    post:
      description: Development and test only. Production returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        "200": { description: Development session created }
        "404": { description: Development authentication is disabled }
  /api/auth/google/start:
    get:
      description: Starts backend Google Authorization Code OIDC with S256 PKCE, state, and nonce.
      responses:
        "307":
          description: Redirect to Google and set an HttpOnly OAuth state cookie
        "404": { description: Google authentication is disabled }
        "429": { description: Login start rate limited }
  /api/auth/google/callback:
    get:
      description: Backend-only callback. Authorization codes and tokens are never returned to frontend JavaScript. A new Google identity may attach to an existing Email OTP user only for the exact same normalized gmail.com address; non-Gmail matches and pre-existing split identities fail without merging.
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Cook session issued with a Host-only HttpOnly cookie and browser redirected home, or unsafe identity linking rejected and redirected to a generic recovery message
        "401": { description: Invalid, expired, denied, or replayed login attempt }
        "503": { description: Google or authentication persistence unavailable }
  /api/auth/email/request:
    post:
      description: Starts a non-enumerating Email OTP sign-in. The server does not look up account existence before returning the generic challenge response.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpRequest"
      responses:
        "200":
          description: Generic challenge metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailOtpChallenge" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Email or client-address rate limit exceeded }
        "503": { description: OTP persistence or mail delivery unavailable }
  /api/auth/email/verify:
    post:
      description: Verifies and consumes a one-time challenge, then creates or resolves only the Email OTP identity and issues a Cook session.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpVerify"
      responses:
        "200":
          description: Cook session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid, expired, exhausted, or replayed challenge }
        "429": { description: Challenge or client-address rate limit exceeded }
  /api/auth/passkey/start:
    post:
      description: Starts username-first passkey login for an explicitly linked Email OTP identity. Unknown users and users without credentials share the same unauthorized response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: WebAuthn credential request options; a short-lived HttpOnly ceremony cookie is set.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: Passkey login cannot be started }
        "429": { description: Email or client-address rate limit exceeded }
  /api/auth/passkey/finish:
    post:
      description: Verifies the WebAuthn assertion, atomically updates credential state, and issues a Cook session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Cook session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid, expired, replayed, or failed WebAuthn ceremony }
  /api/auth/logout:
    post:
      responses:
        "204": { description: Current server-side session revoked and cookies cleared }
  /api/auth/logout-all:
    post:
      responses:
        "204": { description: Every active session for the authenticated Cook user revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/security:
    get:
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Explicitly linked email identities and active passkeys for the current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/security/email/request:
    post:
      security:
        - sessionCookie: []
      description: Starts an Email OTP link challenge bound to the current Cook user.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpRequest"
      responses:
        "200":
          description: Generic challenge metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailOtpChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { description: A Google-first account supplied an email other than its verified Google email }
        "429": { description: Email or client-address rate limit exceeded }
  /api/settings/security/email/verify:
    post:
      security:
        - sessionCookie: []
      description: Consumes a link challenge only for the Cook user who started it. Google-first accounts must verify the exact normalized email stored on their Google identity. Existing ownership by another account returns conflict and never merges accounts.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpVerify"
      responses:
        "200":
          description: Updated account security settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { description: Invalid, expired, exhausted, replayed, or wrong-user challenge }
        "409": { description: Email identity is already linked to another Cook account }
  /api/settings/security/passkeys/register/start:
    post:
      security:
        - sessionCookie: []
      description: Starts passkey registration for an authenticated account with an explicitly linked email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: WebAuthn credential creation options; a short-lived HttpOnly ceremony cookie is set.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: No linked email or invalid credential name }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/security/passkeys/register/finish:
    post:
      security:
        - sessionCookie: []
      description: Verifies and stores a globally unique passkey credential for the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Passkey registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "401": { description: Invalid, expired, replayed, or wrong-user ceremony }
        "409": { description: Credential ID already belongs to an account }
  /api/settings/security/passkeys/{id}:
    delete:
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Current user's passkey revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Passkey missing or owned by another account }
  /api/recipes:
    get:
      responses:
        "200":
          description: Owned recipes and other users' public recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
    post:
      requestBody:
        $ref: "#/components/requestBodies/RecipeInput"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
  /api/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      responses:
        "200":
          description: Owned or public recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "404": { description: Missing or not visible }
    put:
      description: Owner-only optimistic update. The current recipe version is required so browser and AI edits cannot silently overwrite one another.
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
      requestBody:
        $ref: "#/components/requestBodies/RecipeInput"
      responses:
        "200": { description: Recipe updated }
        "409": { description: Recipe version changed; reload and compare before retrying }
        "404": { description: Missing or not owned }
    delete:
      description: Owner only
      responses:
        "204": { description: Recipe deleted }
        "404": { description: Missing or not owned }
  /api/recipes/{id}/favorite:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    put:
      responses:
        "204": { description: Favorited }
    delete:
      responses:
        "204": { description: Unfavorited }
  /api/pantry:
    get:
      responses:
        "200":
          description: Current account pantry only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PantryItem" }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/PantryItemInput" }
      responses:
        "200": { description: Updated account pantry }
  /api/shopping-list:
    get:
      responses:
        "200":
          description: Current account ingredients still needed, including derived automatic restock items. Completed state is never returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShoppingItem" }
    post:
      description: Add or reactivate a private manual shopping item. Canonical and normalized duplicates merge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemInput" }
      responses:
        "201": { description: Updated private shopping list }
  /api/shopping-list/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      description: Edit an item that has a manual source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemInput" }
      responses:
        "200": { description: Updated private shopping list }
        "404": { description: Missing, cross-account, or not manually editable }
    delete:
      description: >
        Idempotently remove every persisted manual or recipe source for this exact concrete or
        choice item without changing pantry or recipes. An automatic-only derived item cannot be
        permanently deleted; the response requires disabling auto-restock. If a concrete item also
        has an automatic source, persisted sources are removed and the automatic item remains.
        No deletion undo is advertised because the bounded replay record is not a safe state snapshot.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingDeleteInput" }
      responses:
        "200":
          description: Explicit deletion outcome and current private shopping list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingDeleteResponse" }
        "404": { description: Missing or cross-account item }
        "409": { description: Stale expectedVersion or idempotency fingerprint conflict; refresh before retrying }
        "429": { description: Delete rate or retained replay-action limit reached }
  /api/shopping-list/{id}/purchase:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      description: Atomically resolve or create pantry state, mark it available, and remove all persistent shopping sources or keep them. Retries with the same key execute once.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingPurchaseInput" }
      responses:
        "200":
          description: Latest pantry and shopping state plus reversible purchase action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingPurchaseResponse" }
        "409": { description: Optimistic version, pantry resolution, or idempotency conflict }
        "429": { description: Purchase rate or retained-action limit reached }
  /api/shopping-list/purchases/{id}/undo:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      description: Restore the pre-purchase pantry snapshot and source set only when neither affected state changed afterward.
      responses:
        "200": { description: Updated private shopping list }
        "409": { description: Safe automatic undo is unavailable because state changed }
  /api/recipes/{id}/shopping-list-items:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      description: Add a verified ingredient from an owned or public visible recipe to the current account's private shopping list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeShoppingInput" }
      responses:
        "201": { description: Updated private shopping list }
        "404": { description: Recipe or ingredient is not visible or does not match the recipe }
  /api/authors/{handle}:
    parameters:
      - in: path
        name: handle
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    get:
      description: Public author profile containing only the immutable random handle, optional public nickname, and public recipes. Authentication identities and internal user IDs are never returned.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Stable keyset-paginated public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAuthorProfile" }
        "404": { description: Unknown author handle }
  /api/authors/{handle}/favorite:
    parameters:
      - in: path
        name: handle
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    put:
      description: Privately favorite another account. Self-favorites are rejected.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Favorite relationship exists }
        "400": { description: Self-favorite rejected }
        "404": { description: Unknown author handle }
    delete:
      description: Remove the current account's private favorite relationship.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Favorite relationship removed or absent }
        "404": { description: Unknown author handle }
  /api/favorite-accounts:
    get:
      description: Lists only the current account's favorite public authors.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Favorite authors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FavoriteAuthor" }
  /api/ingredients/suggestions:
    get:
      description: Returns ranked ingredient candidates visible to the current account. Fuzzy results are advisory and are never applied to hard recommendation matching without explicit selection.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Exact, confirmed-alias, prefix, substring, and bounded-fuzzy candidates in rank order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IngredientSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/recommendations:
    get:
      responses:
        "200":
          description: Current account recommendation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationSettings" }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationSettings" }
      responses:
        "200": { description: Settings saved }
  /api/recommendations:
    post:
      parameters:
        - in: query
          name: limit
          description: Maximum ranked recipes returned. Candidate scanning remains complete so the highest-ranked results are not missed.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: Bounded deterministic top-N recommendations after source, visibility, required, excluded, and ingredient-scope hard filters. Desired matches form the first ranking partition.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/Recommendation" }
        "400":
          description: Invalid filters. If one or more submitted canonical IDs are not visible to the authenticated account, error is canonical_ingredient_unavailable and canonicalIngredientIds echoes only those submitted IDs so a URL client can explicitly downgrade them to the accompanying names.
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error: { type: string, enum: [validation_error, canonical_ingredient_unavailable] }
                  message: { type: string }
                  canonicalIngredientIds:
                    type: array
                    items: { type: string }
        "429": { description: Per-account/IP recommendation request limit exceeded }
  /api/settings/import-tokens:
    get:
      description: Lists non-secret metadata and scopes for the authenticated user's AI tokens. Token secrets are never returned.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Import token metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      description: Creates either the minimal recipes:import token or a private-recipe management token. The secret is returned exactly once.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateImportTokenInput" }
      responses:
        "201":
          description: One-time token secret and persistent metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedImportToken" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: JSON shape contains unsupported or invalid fields }
  /api/settings/import-tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/ImportTokenId"
    delete:
      description: Revokes an import token owned by the authenticated user.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Token revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
  /api/recipes/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      description: Replaces the authenticated owner's single cover image. JPEG, PNG, and WebP are decoded under resource limits, orientation-corrected, resized to at most 1600px, metadata-stripped, and re-encoded as JPEG. Retrying the same owner/recipe Idempotency-Key with the same normalized image and metadata replays the original version result.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
        - $ref: "#/components/parameters/CoverIdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RecipeImageUpload" }
      responses:
        "200":
          description: Cover image replaced and recipe version incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version changed }
        "429": { description: New cover mutation rate or active replay-key capacity exceeded; exact committed replays are exempt }
        "413": { description: Upload, decoded pixels, decoder allocation, or normalized bytes exceed the documented limit }
    put:
      description: Updates alt text and optional source/license/attribution for the authenticated owner's existing cover.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
        - $ref: "#/components/parameters/CoverIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeImageMetadata" }
      responses:
        "200":
          description: Cover metadata updated and recipe version incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Recipe or cover missing or not owned }
        "409": { description: Recipe version changed }
        "429": { description: New cover mutation rate or active replay-key capacity exceeded; exact committed replays are exempt }
    delete:
      description: Removes the authenticated owner's cover image without deleting the recipe.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
        - $ref: "#/components/parameters/CoverIdempotencyKey"
      responses:
        "200":
          description: Cover image removed and recipe version incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version changed }
        "429": { description: New cover mutation rate or active replay-key capacity exceeded; exact committed replays are exempt }
  /api/recipe-images/{id}:
    get:
      description: Returns a normalized JPEG by random image ID. Public recipe images require cache revalidation on reuse so unpublish/delete can return 404; private images require the owner session or an owner token with recipes:read and use private, no-store caching.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - {}
        - sessionCookie: []
        - importBearer: []
      responses:
        "200":
          description: Normalized cover bytes with ETag, Content-Length, nosniff, and visibility-appropriate Cache-Control
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304": { description: ETag matched }
        "401": { description: A supplied Bearer token is invalid, expired, or revoked }
        "404": { description: Image missing or private image not owned }
  /api/ai/capabilities:
    get:
      description: Inspects safe metadata for any valid non-revoked, non-expired Cook AI bearer token. No business scope is required; every business endpoint still enforces its own scopes. This capability bucket allows 120 requests per token per hour.
      security:
        - importBearer: []
      responses:
        "200":
          description: Safe token capability metadata; never includes owner/account data, internal token ID, or the full token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiCapabilities" }
        "401": { description: Invalid, expired, or revoked token }
        "429": { description: Capability inspection rate limit exceeded }
  /api/ai/recipes:
    get:
      description: Lists only recipes owned by the token principal. Requires recipes:read, whose bucket allows 240 requests per token per hour.
      security:
        - importBearer: []
      responses:
        "200":
          description: Owned recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      description: Creates a recipe for the token principal. The default visibility is private; public requires recipes:publish in addition to recipes:write. The recipes:write bucket allows 600 requests per token per hour. An Idempotency-Key is required, and retries with the same token/key return the original recipe.
      security:
        - importBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRecipeInput" }
            example:
              title: Tomato noodles
              description: A private weeknight recipe.
              instructions: Boil the noodles, cook the tomatoes, and combine.
              visibility: private
              sourceUrl: https://example.com/recipes/tomato-noodles
              sourceTitle: Tomato noodles
              sourceAuthor: Example author
              sourceLicense: CC-BY-4.0
              sourceAttribution: Example author — Tomato noodles
              ingredients:
                - name: noodles
                  quantityNote: 200 g
                - name: tomato
                  quantityNote: 3
      responses:
        "201": { description: Recipe created, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "200": { description: Idempotent replay of the original creation, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: Token rate limit exceeded }
  /api/ai/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      description: Reads an owned recipe. Cross-account IDs return 404. Requires recipes:read, whose bucket allows 240 requests per token per hour.
      security:
        - importBearer: []
      responses:
        "200": { description: Owned recipe, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
    put:
      description: Optimistically updates an owned recipe. Without recipes:publish, public recipe changes create a pending owner-reviewed revision. With recipes:publish, the token may publish an owned private recipe or directly update an owned public recipe; stale versions still return 409. The recipes:write bucket allows 600 requests per token per hour.
      security:
        - importBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRecipeInput" }
            example:
              title: Tomato noodles
              description: Updated after the user's feedback.
              instructions: Boil the noodles, simmer the tomatoes, and combine.
              ingredients:
                - name: noodles
                  quantityNote: 200 g
                - name: tomato
                  quantityNote: 4
              expectedVersion: 3
      responses:
        "200": { description: Direct owned update or pending public revision, depending on scopes, content: { application/json: { schema: { $ref: "#/components/schemas/AiRecipeMutation" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version is stale or a pending revision already exists }
  /api/ai/recipes/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      - $ref: "#/components/parameters/RecipeVersion"
    post:
      description: Replaces an owned recipe cover. Requires recipes:images:write, whose bucket allows 300 requests per token per hour. Public covers create a pending revision unless the token also has recipes:publish, in which case the live cover changes directly.
      security:
        - importBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RecipeImageUpload" }
      responses:
        "200": { description: Direct owned image update or pending public revision, depending on scopes, content: { application/json: { schema: { $ref: "#/components/schemas/AiRecipeMutation" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version is stale or a pending revision already exists }
        "413": { description: Image resource limit exceeded }
    delete:
      description: Removes an owned cover. Requires recipes:images:write, whose bucket allows 300 requests per token per hour. Public cover removal creates a pending revision unless the token also has recipes:publish. Recipe deletion is not supported.
      security:
        - importBearer: []
      responses:
        "200": { description: Direct owned image removal or pending public revision, depending on scopes, content: { application/json: { schema: { $ref: "#/components/schemas/AiRecipeMutation" } } } }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version is stale or a pending revision already exists }
  /api/recipe-revisions:
    get:
      description: Lists pending AI revisions owned by the authenticated user.
      security:
        - sessionCookie: []
      parameters:
        - name: recipeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pending revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/recipe-revisions/{id}/accept:
    post:
      description: Atomically applies an owned pending revision only when the live recipe version still matches, then marks the revision accepted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeRevisionId"
      responses:
        "200": { description: Updated live recipe, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Revision missing or not owned }
        "409": { description: Live recipe changed after the revision was created }
  /api/recipe-revisions/{id}/cover:
    get:
      description: Returns the normalized proposed cover for an owned pending replacement revision. Never public and always private, no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeRevisionId"
      responses:
        "200":
          description: Proposed normalized JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Revision image missing or not owned }
  /api/recipe-revisions/{id}:
    delete:
      description: Rejects an owned pending revision without changing the live recipe.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeRevisionId"
      responses:
        "204": { description: Revision rejected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Revision missing or not owned }
  /api/import/drafts:
    post:
      description: Token-only endpoint used by the official AI-client skill. The owner is derived from the token; the server does not fetch sourceUrl. Creates a private review draft, not a recipe.
      security:
        - importBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportDraftSubmission" }
            examples:
              browserExtraction:
                value:
                  schemaVersion: "1.0"
                  sourceUrl: https://example.com/recipes/tomato-pasta
                  sourceTitle: Tomato pasta
                  sourceAuthor: Example Kitchen
                  title: Tomato pasta
                  description: A concise summary rewritten from the source.
                  ingredients:
                    - name: pasta
                      quantityNote: 200 g
                    - name: tomato
                      quantityNote: 3
                  steps:
                    - Boil the pasta until tender.
                    - Cook the tomatoes into a sauce and combine.
                  warnings:
                    - The source did not specify the amount of salt.
                  confidence: 0.86
      responses:
        "201":
          description: Private draft ready for authenticated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Missing, invalid, expired, revoked, or incorrectly scoped import token }
        "429": { description: Per-token rate limit or per-account active-draft quota exceeded }
        "422": { description: JSON shape contains unsupported or invalid fields }
  /api/import-drafts:
    get:
      description: Lists the authenticated user's own import drafts.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Owner-scoped drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/import-drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/ImportDraftId"
    get:
      description: Returns one import draft owned by the authenticated user.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Import draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
    put:
      description: Edits a pending import draft owned by the authenticated user. A legacy ingredients-only update of an existing OR or optional draft returns 400 ingredient_groups_required instead of flattening it.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportDraftUpdate" }
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
        "409": { description: Draft has already been consumed or discarded }
        "422": { description: JSON shape contains unsupported or invalid fields }
    delete:
      description: Discards a pending import draft owned by the authenticated user.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Draft discarded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing, not owned, or no longer pending }
  /api/import-drafts/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/ImportDraftId"
    post:
      description: Transactionally creates a private recipe and consumes the draft exactly once.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Private recipe created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
        "409": { description: Draft has already been consumed or discarded }
  /api/capability-claims/content-moderator/passkey/start:
    post:
      description: Starts a Passkey assertion bound to the current session and a valid one-time 15-minute moderator claim code. Invalid codes and accounts without a Passkey return 404.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 32, maxLength: 256 }
      responses:
        "200": { description: WebAuthn credential request options }
        "404": { description: Claim is unavailable }
  /api/capability-claims/content-moderator/passkey/finish:
    post:
      description: Atomically verifies the Passkey, consumes the claim code, creates the capability assignment, advances authorization version, and refreshes only the current session.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, credential]
              properties:
                code: { type: string, minLength: 32, maxLength: 256 }
                credential: { type: object, additionalProperties: true }
      responses:
        "200": { description: Content moderator capability assigned }
        "404": { description: Claim is unavailable, expired, or already consumed }
        "409": { description: Capability is already assigned }
  /api/recipes/{id}/reports:
    parameters: [{ $ref: "#/components/parameters/RecipeId" }]
    post:
      description: Reports a current public-clear recipe owned by another user. Reporter identity is never returned in moderator DTOs. Duplicates are keyed by reporter, recipe, recipe version, and reason.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationReportInput" }
      responses:
        "200": { description: Existing duplicate report returned }
        "201": { description: Report and bounded public evidence snapshot created }
        "404": { description: Recipe is not reportable }
        "429": { description: Reporter rate limit exceeded }
  /api/notifications:
    get:
      description: Lists up to 100 current-user moderation notifications.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Owner notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerNotification" }
  /api/notifications/{id}/read:
    parameters:
      - { $ref: "#/components/parameters/NotificationId" }
    put:
      description: Marks one current-user notification read.
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Notification marked read }
        "404": { description: Notification is not owned }
  /api/recipes/{id}/appeals:
    parameters: [{ $ref: "#/components/parameters/RecipeId" }]
    get:
      description: Lists the restriction appeals for an owned recipe.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Appeals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationAppeal" }
        "404": { description: Recipe is not owned }
    post:
      description: Creates the one active appeal allowed for the current restriction epoch.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201": { description: Appeal created }
        "404": { description: Recipe is not owned and restricted }
        "409": { description: An appeal already exists for this restriction }
  /api/admin/reauth/passkey/start:
    post:
      description: Starts a Passkey assertion for the current moderator session. Non-moderators receive 404.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: WebAuthn credential request options }
        "404": { description: Moderator capability not present }
  /api/admin/reauth/passkey/finish:
    post:
      description: Verifies the assertion and raises only the current session's Passkey assurance for ten minutes.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Current session assurance refreshed }
        "404": { description: Moderator capability not present }
  /api/admin/moderation/queue:
    get:
      description: Keyset-paginated public-content moderation queue. Private unreviewed recipes are excluded. Non-moderators receive 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationQueuePage" }
        "404": { description: Moderator capability not present }
  /api/admin/moderation/cases/{id}:
    parameters:
      - { $ref: "#/components/parameters/ModerationCaseId" }
    get:
      description: Returns a bounded public evidence snapshot, anonymous reports, and active appeal after fresh Passkey verification.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Moderation case without reporter identity or authentication data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCaseDetail" }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
        "404": { description: Moderator capability absent, case missing, or self-moderation denied }
  /api/admin/moderation/cases/{id}/evidence-image:
    parameters:
      - { $ref: "#/components/parameters/ModerationCaseId" }
    get:
      description: Returns the case-owned immutable normalized evidence image to a freshly reauthenticated non-owner moderator. Later image rotation, replacement, or deletion does not change this response, and the endpoint does not grant access through the ordinary recipe image URL.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: "Private evidence image with Cache-Control: private, no-store"
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
        "404": { description: Moderator capability absent, image/case missing, or self-moderation denied }
  /api/admin/moderation/recipes/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/RecipeId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      description: Marks a non-owned recipe reviewed with optimistic recipe and moderation versions. An active open case requires its exact version and is atomically resolved without action.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReviewMutation" }
      responses:
        "200": { description: Recipe marked reviewed }
        "409": { description: A supplied version is stale or the idempotency fingerprint differs }
  /api/admin/moderation/recipes/{id}/restrict:
    parameters:
      - { $ref: "#/components/parameters/RecipeId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      description: Restricts a non-owned recipe atomically, rotates its public image ID, updates its case, notifies the owner, and appends an audit event. Requires same-origin and fresh Passkey verification.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModerationMutation" }
      responses:
        "200": { description: Recipe restricted }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
        "404": { description: Moderator capability absent or self-moderation denied }
        "409": { description: A supplied version is stale or the idempotency fingerprint differs }
  /api/admin/moderation/recipes/{id}/reinstate:
    parameters:
      - { $ref: "#/components/parameters/RecipeId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      description: Reinstates a non-owned restricted recipe and exposes a newly rotated image URL. Requires same-origin and fresh Passkey verification.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModerationMutation" }
      responses:
        "200": { description: Recipe reinstated }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
        "409": { description: A supplied version is stale }
  /api/admin/moderation/appeals/{id}/resolve:
    parameters:
      - { $ref: "#/components/parameters/ModerationAppealId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      description: Atomically reinstates or upholds one exact active appeal with optimistic recipe, moderation, case, and appeal versions.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppealResolutionInput" }
      responses:
        "200": { description: Appeal resolved }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
        "409": { description: A supplied version is stale }
  /api/admin/audit-events:
    get:
      description: Lists PII-free append-only moderation audit metadata. Non-moderators receive 404.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Audit event page }
        "404": { description: Moderator capability not present }
  /api/admin/audit-events/{id}:
    parameters:
      - { $ref: "#/components/parameters/ModerationAuditEventId" }
    get:
      description: Returns one PII-free audit event after fresh Passkey verification.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Audit event }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
  /api/admin/audit-events/export:
    get:
      description: Exports up to 10,000 PII-free audit events as JSON after fresh Passkey verification.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Audit JSON export }
        "403": { $ref: "#/components/responses/AdminReauthRequired" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cook_session
    importBearer:
      type: http
      scheme: bearer
      bearerFormat: cook_imp
      description: Scoped Cook AI token. The endpoint enforces recipes:import, recipes:read, recipes:write, recipes:images:write, or recipes:publish as documented.
  parameters:
    RecipeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModerationCaseId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModerationAppealId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModerationAuditEventId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong recipe version validator in the form `"recipe-v<version>"`.
      schema:
        type: string
        pattern: '^"recipe-v[1-9][0-9]*"$'
    ImportTokenId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportDraftId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeRevisionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CoverIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key in `<unix-seconds>.<random>` form. Exact cover mutation results replay for 24 hours; expired keys return 409 and must be replaced after reloading the recipe version.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[0-9]+\.[A-Za-z0-9_.:-]+$'
    RecipeVersion:
      name: If-Match
      in: header
      required: true
      description: Current live recipe version using the exact form "recipe-v<version>" including quotes.
      schema: { type: string, pattern: '^"recipe-v[1-9][0-9]*"$' }
  responses:
    Unauthorized:
      description: Host-only Cook session is absent or invalid
    ValidationError:
      description: Request failed server-side validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Token is valid but lacks the required scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminReauthRequired:
      description: Moderator capability is confirmed but the current session lacks a Passkey assertion from the last ten minutes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  requestBodies:
    RecipeInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecipeInput" }
    EmailOtpRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string, format: email }
    EmailOtpVerify:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challengeId, code]
            properties:
              challengeId:
                type: string
                description: Opaque 256-bit challenge identifier; never place it or the code in URLs or logs.
              code: { type: string, pattern: "^[0-9]{6}$" }
  schemas:
    User:
      type: object
      description: Private current-user DTO. It is never embedded as another recipe author's public profile.
      required: [id, email, displayName, nickname, onboardingCompleted, locale, capabilities]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        nickname: { type: [string, "null"], maxLength: 40 }
        onboardingCompleted: { type: boolean }
        locale:
          type: [string, "null"]
          enum: [en, zh-CN, null]
          description: Account-level interface locale. Null is an initialization state only, not a translated anonymous value.
        capabilities:
          type: array
          description: Product-level capabilities for the current user only. This field is never exposed in public author or recipe DTOs.
          items: { type: string, enum: [content_moderation] }
    ProfileInput:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: [string, "null"]
          maxLength: 40
          description: Null selects anonymous. Values are trimmed and may not contain control characters, unusual whitespace, or repeated spaces.
    LocaleInput:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale: { type: string, enum: [en, zh-CN] }
    EmailOtpChallenge:
      type: object
      required: [challengeId, expiresAt, resendAllowedAt]
      properties:
        challengeId: { type: string }
        expiresAt: { type: string, format: date-time }
        resendAllowedAt: { type: string, format: date-time }
    Passkey:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
    SecuritySettings:
      type: object
      required: [linkedEmails, googleEmail, googleSignInStatus, passkeys]
      properties:
        linkedEmails:
          type: array
          items: { type: string, format: email }
        googleEmail:
          type: [string, "null"]
          format: email
          description: Current user's private Google verified email, if linked. Never exposed in public author DTOs.
        googleSignInStatus:
          type: string
          enum: [linked, eligible, unsupported, unavailable]
          description: Whether Google is already linked, may be added by exact Gmail match, is unsupported for a non-Gmail email-first account, or lacks an email identity.
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
    Ingredient:
      type: object
      required: [name, quantityNote]
      properties:
        name:
          type: string
          minLength: 1
          description: A pasted delimiter-separated list is accepted on write; each resulting ingredient name is limited to 120 characters.
        quantityNote: { type: string, maxLength: 240 }
        canonicalIngredientId:
          type: [string, "null"]
          description: Canonical identity selected explicitly by the user. Omit or send null to keep the normalized input without alias binding.
    IngredientAlternative:
      type: object
      additionalProperties: false
      required: [id, name, quantityNote, sortOrder]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
          description: Stable within its containing recipe, revision, or import draft. The same client ID may be reused in another resource.
        name: { type: string, minLength: 1, maxLength: 120 }
        quantityNote: { type: string, maxLength: 240, default: "" }
        canonicalIngredientId: { type: [string, "null"] }
        sortOrder:
          type: integer
          minimum: 0
          description: Required explicit zero-based display order, unique within the containing group. Cook's web editor serializes current visible order as consecutive values.
    IngredientGroup:
      type: object
      additionalProperties: false
      required: [id, optional, note, sortOrder, alternatives]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
          description: Stable within its containing recipe, revision, or import draft. The same client ID may be reused in another resource.
        optional: { type: boolean, default: false }
        note:
          type: string
          maxLength: 240
          default: ""
          description: Group-level guidance. For a single-alternative group, the deprecated ingredients projection uses the alternative quantityNote, not this note.
        sortOrder:
          type: integer
          minimum: 0
          description: Required explicit zero-based display order, unique across recipe groups. Cook's web editor serializes current visible order as consecutive values.
        alternatives:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/IngredientAlternative" }
    RecipeInput:
      type: object
      required: [title, description, instructions, visibility]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description:
          type: string
          maxLength: 2000
          description: Markdown source. Raw HTML and embedded images are not rendered by Cook.
        instructions:
          type: string
          maxLength: 20000
          description: Markdown source. Raw HTML and embedded images are not rendered by Cook.
        visibility: { type: string, enum: [private, public], default: private }
        difficulty:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Optional whole-recipe difficulty aligned with the 1–5 source scale.
        estimatedCalories:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: Optional estimated total kcal for the whole recipe, not per serving or medical nutrition data.
        sourceUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: Optional HTTP or HTTPS recipe source URL.
        sourceTitle: { type: [string, "null"], maxLength: 200 }
        sourceAuthor: { type: [string, "null"], maxLength: 200 }
        sourceLicense:
          type: [string, "null"]
          maxLength: 200
          description: License text supplied by the user/source; Cook does not independently verify it.
        sourceAttribution: { type: [string, "null"], maxLength: 1000 }
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
          deprecated: true
          description: Legacy write shape. Accepted only when ingredientGroups is absent and mapped to required single-alternative groups.
        ingredientModel:
          type: string
          const: groups-v1
        ingredientGroups:
          type: array
          minItems: 1
          maxItems: 100
          description: Ordered AND groups; alternatives within each group are OR. At most 100 alternatives across all groups.
          items: { $ref: "#/components/schemas/IngredientGroup" }
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          required: [id, version, isOwner, authorHandle, authorNickname, publicationIntent, moderationState, moderationReviewState, moderationVersion, difficulty, estimatedCalories, ingredientModel, ingredientGroups, ingredients, isFavorite, isFavoriteAuthor, source, coverImage]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            isOwner: { type: boolean }
            authorHandle:
              type: string
              pattern: "^[0-9a-f]{32}$"
              description: Immutable random public handle unrelated to internal IDs or authentication identities.
            authorNickname:
              type: [string, "null"]
              description: Opt-in public nickname. Null must be rendered as the locale's anonymous label.
            publicationIntent:
              type: string
              enum: [private, public]
              description: Author-controlled publication intent. A restricted owner may still have public intent while effective visibility remains private.
            moderationState:
              type: string
              enum: [clear, restricted]
            moderationReviewState:
              type: string
              enum: [unreviewed, reviewed]
            moderationVersion: { type: integer, minimum: 1 }
            isFavorite: { type: boolean }
            isFavoriteAuthor: { type: boolean }
            source:
              oneOf:
                - $ref: "#/components/schemas/RecipeSource"
                - type: "null"
            coverImage:
              oneOf:
                - $ref: "#/components/schemas/RecipeImage"
                - type: "null"
    RecipeVersion:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 2 }
    ModerationReportInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, unsafe_or_harmful, harassment_or_hate, privacy, copyright_or_attribution, misleading, other]
        details:
          type: string
          maxLength: 500
          description: Plain text only. It is never interpreted as Markdown or HTML.
    OwnerNotification:
      type: object
      required: [id, recipeId, kind, reasonCode, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        kind: { type: string, enum: [recipe_restricted, recipe_reinstated, appeal_upheld, content_removed] }
        reasonCode: { type: string }
        createdAt: { type: integer }
        readAt: { type: [integer, "null"] }
    ModerationAppeal:
      type: object
      required: [id, restrictionEpoch, status, reason, resolutionReason, version, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        restrictionEpoch: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, reinstated, upheld, content_removed] }
        reason: { type: string, maxLength: 1000 }
        resolutionReason: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: integer }
        resolvedAt: { type: [integer, "null"] }
    ModerationQueuePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [recipeId, title, authorHandle, reviewState, moderationState, recipeVersion, moderationVersion, caseId, caseVersion, reportCount, activeAppeal, updatedAt]
            properties:
              recipeId: { type: string, format: uuid }
              title: { type: string }
              authorHandle: { type: string }
              reviewState: { type: string, enum: [unreviewed, reviewed] }
              moderationState: { type: string, enum: [clear, restricted] }
              recipeVersion: { type: integer, minimum: 1 }
              moderationVersion: { type: integer, minimum: 1 }
              caseId: { type: [string, "null"] }
              caseVersion: { type: [integer, "null"] }
              reportCount: { type: integer, minimum: 0 }
              activeAppeal: { type: boolean }
              updatedAt: { type: string }
        nextCursor: { type: [string, "null"] }
    ModerationCaseDetail:
      type: object
      required: [id, recipeId, status, version, createdAt, updatedAt, recipeVersion, moderationVersion, evidence, reports, appeal]
      properties:
        id: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        status: { type: string, enum: [open, restricted, resolved, reinstated, upheld, content_removed] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        recipeVersion: { type: [integer, "null"], minimum: 1 }
        moderationVersion: { type: [integer, "null"], minimum: 1 }
        evidence:
          type: object
          description: Bounded evidence for the version currently eligible for a moderation decision. Restricted edits refresh this evidence and increment the case version.
          required: [recipeVersion, title, description, instructions, authorHandle, imageId]
          properties:
            recipeVersion: { type: integer, minimum: 1 }
            title: { type: string, maxLength: 120 }
            description: { type: string, maxLength: 2000 }
            instructions: { type: string, maxLength: 20000 }
            authorHandle: { type: string }
            imageId:
              type: [string, "null"]
              description: Opaque image identifier captured with the evidence; clients read immutable bytes through the case evidence-image endpoint rather than the ordinary recipe-image URL.
        reports:
          type: array
          items:
            type: object
            required: [reason, details, recipeVersion, createdAt]
            properties:
              reason: { type: string }
              details: { type: string, maxLength: 500 }
              recipeVersion: { type: integer, minimum: 1 }
              createdAt: { type: integer }
        appeal:
          oneOf:
            - type: "null"
            - type: object
              required: [id, reason, version, createdAt]
              properties:
                id: { type: string, format: uuid }
                reason: { type: string, maxLength: 1000 }
                version: { type: integer, minimum: 1 }
                createdAt: { type: integer }
    AdminModerationMutation:
      type: object
      additionalProperties: false
      required: [expectedRecipeVersion, expectedModerationVersion, reasonCode]
      properties:
        expectedRecipeVersion: { type: integer, minimum: 1 }
        expectedModerationVersion: { type: integer, minimum: 1 }
        expectedCaseVersion: { type: [integer, "null"], minimum: 1 }
        reasonCode:
          type: string
          enum: [policy_violation, safety, privacy, copyright, spam, appeal_reviewed, other]
    AdminReviewMutation:
      type: object
      additionalProperties: false
      required: [expectedRecipeVersion, expectedModerationVersion, reasonCode]
      properties:
        expectedRecipeVersion: { type: integer, minimum: 1 }
        expectedModerationVersion: { type: integer, minimum: 1 }
        expectedCaseVersion:
          type: [integer, "null"]
          minimum: 1
          description: Required and exact when an active open case exists; otherwise null.
        reasonCode:
          type: string
          enum: [no_action_needed, report_resolved, appeal_reviewed, other]
    AppealResolutionInput:
      type: object
      additionalProperties: false
      required: [resolution, expectedRecipeVersion, expectedModerationVersion, expectedCaseVersion, expectedAppealVersion, reasonCode]
      properties:
        resolution: { type: string, enum: [reinstate, uphold] }
        expectedRecipeVersion: { type: integer, minimum: 1 }
        expectedModerationVersion: { type: integer, minimum: 1 }
        expectedCaseVersion: { type: integer, minimum: 1 }
        expectedAppealVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum: [policy_violation, safety, privacy, copyright, spam, appeal_reviewed, other]
    RecipeImage:
      type: object
      required: [id, url, width, height, altText, sourceUrl, sourceLicense, sourceAttribution, version]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        width: { type: integer, minimum: 1, maximum: 1600 }
        height: { type: integer, minimum: 1, maximum: 1600 }
        altText: { type: string, minLength: 1, maxLength: 300 }
        sourceUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        sourceLicense: { type: [string, "null"], maxLength: 120 }
        sourceAttribution: { type: [string, "null"], maxLength: 500 }
        version: { type: integer, minimum: 1 }
    RecipeImageMetadata:
      type: object
      additionalProperties: false
      required: [altText]
      properties:
        altText: { type: string, minLength: 1, maxLength: 300 }
        sourceUrl:
          oneOf:
            - { type: string, const: "" }
            - { type: string, format: uri, maxLength: 2048 }
        sourceLicense: { type: string, maxLength: 120, default: "" }
        sourceAttribution: { type: string, maxLength: 500, default: "" }
    RecipeImageUpload:
      type: object
      required: [image, altText]
      properties:
        image:
          type: string
          format: binary
          description: JPEG, PNG, or WebP only; at most 8 MiB request file, 20 megapixels, 10000px decoder dimensions, 128 MiB decoder allocation, and 2.5 MB normalized storage.
        altText: { type: string, minLength: 1, maxLength: 300 }
        sourceUrl: { type: string, format: uri, maxLength: 2048 }
        sourceLicense: { type: string, maxLength: 120 }
        sourceAttribution: { type: string, maxLength: 500 }
    RecipeSource:
      type: object
      required: [url, title, author, license, attribution, warnings, confidence]
      properties:
        url: { type: [string, "null"], format: uri }
        title: { type: [string, "null"] }
        author: { type: [string, "null"] }
        license: { type: [string, "null"] }
        attribution: { type: [string, "null"] }
        warnings:
          type: array
          items: { type: string }
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    PantryItemInput:
      type: object
      required: [name, status, quantityNote]
      properties:
        name:
          type: string
          description: May contain a comma, full-width comma, Chinese enumeration comma, semicolon, full-width semicolon, or newline separated list. The server NFKC-normalizes and deduplicates entries; each resulting name is limited to 120 characters.
        status: { type: string, enum: [have, out, unknown] }
        quantityNote: { type: string, maxLength: 240 }
        expiresOn:
          type: [string, "null"]
          format: date
          description: Date-only pantry expiration. Omit to preserve the current value; send null to clear it.
        canonicalIngredientId:
          type: [string, "null"]
          description: Canonical identity selected explicitly by the user.
        autoAddToShoppingListWhenOut:
          type: boolean
          description: Omit to preserve the current value. When true, only an explicit out status derives an automatic shopping item.
    PantryItem:
      allOf:
        - $ref: "#/components/schemas/PantryItemInput"
        - type: object
          required: [id, expiresOn, canonicalIngredientId, aliases, autoAddToShoppingListWhenOut, version]
          properties:
            id: { type: string, format: uuid }
            confirmedAt: { type: [string, "null"], format: date-time }
            aliases:
              type: array
              items: { type: string }
              description: Owner-confirmed normalized aliases for this canonical pantry ingredient.
            version: { type: integer, minimum: 1 }
    ShoppingItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        canonicalIngredientId:
          type: [string, "null"]
          description: Canonical identity selected explicitly by the user. Similar or fuzzy candidates are not inferred.
    RecipeShoppingInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        canonicalIngredientId: { type: [string, "null"] }
        groupId:
          type: [string, "null"]
          description: Stable recipe ingredient group ID. Without alternativeId, adds an exact identity-set choice.
        alternativeId:
          type: [string, "null"]
          description: Stable alternative ID selecting a concrete item from groupId.
    ShoppingItemSource:
      type: object
      required: [kind, label, recipeId]
      properties:
        kind: { type: string, enum: [automatic, manual, recipe] }
        label: { type: string }
        recipeId: { type: [string, "null"], format: uuid }
    ShoppingItem:
      type: object
      required: [id, name, canonicalIngredientId, choiceAlternatives, automatic, pantryItemId, sources, version, purchaseOptions]
      properties:
        id:
          type: string
          description: UUID for persisted items or an opaque auto-prefixed identifier for a purely derived item.
        name: { type: string }
        canonicalIngredientId: { type: [string, "null"] }
        choiceAlternatives:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/ShoppingChoiceAlternative" }
        automatic: { type: boolean }
        pantryItemId: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 1 }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItemSource" }
        purchaseOptions:
          $ref: "#/components/schemas/ShoppingPurchaseOptions"
    ShoppingPurchaseOptions:
      type: object
      required: [resolution, candidates]
      properties:
        resolution:
          type: string
          enum: [reuse, create, choice, selectAlternative]
          description: Candidates are strict whole-term identities only. Advisory prefix, substring, and typo suggestions never become purchase candidates.
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PantryPurchaseCandidate" }
    ShoppingChoiceAlternative:
      type: object
      required: [id, name, canonicalIngredientId, purchaseOptions]
      properties:
        id: { type: string }
        name: { type: string }
        canonicalIngredientId: { type: [string, "null"] }
        purchaseOptions: { $ref: "#/components/schemas/ShoppingPurchaseOptions" }
    PantryPurchaseCandidate:
      type: object
      required: [id, name, status, quantityNote, expiresOn, canonicalIngredientId, autoAddToShoppingListWhenOut, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [have, out, unknown] }
        quantityNote: { type: string }
        expiresOn: { type: [string, "null"], format: date }
        canonicalIngredientId: { type: [string, "null"] }
        autoAddToShoppingListWhenOut: { type: boolean }
        version: { type: integer, minimum: 1 }
    ShoppingPurchaseInput:
      type: object
      required: [disposition, shoppingExpectedVersion, quantityNote, autoAddToShoppingListWhenOut]
      properties:
        disposition: { type: string, enum: [remove, keep] }
        shoppingExpectedVersion: { type: integer, minimum: 1 }
        pantryItemId: { type: [string, "null"], format: uuid }
        createUsingCurrentName:
          type: boolean
          description: Explicit true forces creation and conflicts with an existing strict identity. When omitted, Cook reuses one unambiguous strict identity, creates using the current name when none exists, and requires pantryItemId when strict matches are ambiguous.
        pantryExpectedVersion: { type: [integer, "null"], minimum: 1 }
        expiresOn: { type: [string, "null"], format: date }
        quantityNote: { type: string, maxLength: 240 }
        autoAddToShoppingListWhenOut: { type: boolean }
        selectedAlternativeId:
          type: [string, "null"]
          description: Required when purchasing a choice item; only the selected alternative is applied to pantry.
    ShoppingDeleteInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    ShoppingDeleteResponse:
      type: object
      required: [outcome, requiresDisableAutoRestock, shoppingItems, undoAvailable]
      properties:
        outcome:
          type: string
          enum: [removed, automaticRemains, automaticOnly]
        requiresDisableAutoRestock:
          type: boolean
          description: True when an automatic item remains or will reappear until pantry auto-restock is disabled.
        shoppingItems:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItem" }
        undoAvailable:
          type: boolean
          const: false
    ShoppingPurchaseResponse:
      type: object
      required: [pantry, shoppingItems, purchaseActionId, undoAvailable]
      properties:
        pantry: { $ref: "#/components/schemas/PantryItem" }
        shoppingItems:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItem" }
        purchaseActionId: { type: string, format: uuid }
        undoAvailable: { type: boolean }
    IngredientReference:
      oneOf:
        - type: string
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              description: May contain a supported delimiter-separated list; each resulting name is limited to 120 characters.
            canonicalIngredientId: { type: [string, "null"] }
      description: Legacy strings and structured references with an omitted/null canonicalIngredientId remain unresolved normalized names. Recommendation filters never bind them to a catalog entry or owner alias. Only a client-supplied non-empty canonicalIngredientId selects canonical identity, and fuzzy suggestions are never inferred here.
    IngredientSuggestion:
      type: object
      required: [canonicalIngredientId, displayName, matchedText, reason]
      properties:
        canonicalIngredientId: { type: string }
        displayName: { type: string }
        matchedText: { type: string }
        reason:
          type: string
          enum: [exact, alias, prefix, substring, similar]
          description: exact and alias are whole-term hard identities. Prefix/substring/similar are advisory only; aliases are never expanded. CJK has no substring or edit-distance matching, one-Han-character prefixes are disabled, and Latin typo matching is bounded by query length.
    RecommendationSettings:
      type: object
      required: [includeFavoriteRecipes, includeOwn, includeFavoriteAccounts, includeOtherPublic, verificationDays]
      properties:
        includeFavoriteRecipes: { type: boolean }
        includeOwn: { type: boolean }
        includeFavoriteAccounts: { type: boolean, default: true }
        includeOtherPublic: { type: boolean }
        verificationDays: { type: integer, minimum: 1, maximum: 90 }
    RecommendationRequest:
      type: object
      description: ingredientScope is an intent-v2 hard filter. Recipes outside the selected scope are omitted. Optional source booleans override the account recommendation settings for this request without persisting them. Deprecated pantryOnly maps true to PANTRY_ONLY and false to ANY. Supplying both fields returns 400.
      properties:
        preferred: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/IngredientReference" } }
        required: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/IngredientReference" } }
        excluded: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/IngredientReference" } }
        ingredientScope:
          type: string
          enum: [ANY, PANTRY_ONLY, PANTRY_OR_LIST]
          default: ANY
        includeFavoriteRecipes: { type: boolean }
        includeOwn: { type: boolean }
        includeFavoriteAccounts: { type: boolean }
        includeOtherPublic: { type: boolean }
        pantryOnly:
          type: boolean
          deprecated: true
        today:
          type: string
          format: date
          description: User-local calendar date used for date-only expiration classification. The server UTC date is used when omitted.
    Recommendation:
      type: object
      required: [recipe, status, available, verify, missing, inShoppingList, reasons, reasonDetails, score, scoreBreakdown, primarySource, matchedSources, desiredMatches, rankingIntent, ingredientReasons, ingredientGroupReasons, appliedControls]
      properties:
        recipe: { $ref: "#/components/schemas/Recipe" }
        status: { type: string, enum: [READY, VERIFY, SHOP, BLOCKED] }
        available: { type: array, items: { type: string } }
        verify: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        inShoppingList:
          type: array
          items: { type: string }
          description: Effective groups covered by this owner's active shopping list. A concrete item covers any one exact alternative identity; a choice item covers only the group's exact alternative identity set.
        reasons:
          type: array
          items: { type: string }
          deprecated: true
          description: Legacy English explanations retained for compatibility. New clients should localize reasonDetails.
        reasonDetails:
          type: array
          items:
            oneOf:
              - type: object
                required: [code, confirmed, total]
                properties:
                  code: { const: confirmedIngredients }
                  confirmed: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0 }
              - type: object
                required: [code, count]
                properties:
                  code: { const: preferredIngredients }
                  count: { type: integer, minimum: 1 }
              - type: object
                required: [code, ingredient, expiresOn]
                properties:
                  code: { const: ingredientExpired }
                  ingredient: { type: string }
                  expiresOn: { type: string, format: date }
              - type: object
                required: [code, ingredient]
                properties:
                  code: { const: ingredientExpiresToday }
                  ingredient: { type: string }
              - type: object
                required: [code]
                properties:
                  code: { const: pantryOnlyBlocked }
              - type: object
                required: [code, scope]
                properties:
                  code: { const: ingredientScopeBlocked }
                  scope: { type: string, enum: [ANY, PANTRY_ONLY, PANTRY_OR_LIST] }
        score:
          type: integer
          deprecated: true
          description: Compatibility-only legacy score. intent-v2 never sorts by this value.
        scoreBreakdown:
          type: object
          deprecated: true
          description: Compatibility-only legacy fields. intent-v2 never sorts by these values.
          required: [statusBase, source, availability, desired, certainty, simplicity]
          properties:
            statusBase: { type: integer, enum: [0, 250, 500, 750] }
            source: { type: integer, minimum: 0, maximum: 100 }
            availability:
              type: integer
              minimum: 0
              maximum: 80
              description: Confirmed-available recipe-ingredient coverage scaled to 80.
            desired:
              type: integer
              minimum: 0
              maximum: 40
              description: Requested desired-ingredient hit coverage scaled to 40; zero when no desired ingredients were requested.
            certainty:
              type: integer
              minimum: 0
              maximum: 20
              description: Confirmed, unexpired recipe-ingredient share scaled to 20.
            simplicity:
              type: integer
              minimum: 0
              maximum: 9
              description: Nine minus the missing ingredient count, bounded to this range.
        primarySource: { $ref: "#/components/schemas/RecommendationSource" }
        matchedSources:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/RecommendationSource" }
        desiredMatches: { type: array, items: { type: string } }
        rankingIntent:
          type: object
          required: [version, scopeEligible, desiredTier, desiredMatched, desiredTotal, desiredCoverage, otherMissing, fulfillment, unplannedMissing, shoppingCovered, verify, effectiveGroups, source, sourceTier, available, availableCoverage, reasons]
          properties:
            version: { type: string, const: intent-v2 }
            scopeEligible:
              type: boolean
              const: true
              description: Returned recommendations have already passed the ingredient-scope hard filter.
            desiredTier:
              allOf:
                - { $ref: "#/components/schemas/IngredientGroupAction" }
              description: Worst action among distinctly assigned desired groups, compared only inside the desired-match partition after source tier and match count.
            desiredMatched: { type: integer, minimum: 0, maximum: 100 }
            desiredTotal: { type: integer, minimum: 0, maximum: 100 }
            desiredCoverage:
              type: integer
              minimum: 0
              maximum: 10000
              description: Basis points of distinct requested desired identities assigned to distinct scope-qualified groups.
            otherMissing:
              type: integer
              minimum: 0
              maximum: 100
              description: Effective non-desired groups whose action is SHOPPING_PLANNED or MISSING.
            fulfillment: { type: string, enum: [READY, VERIFY, SHOP, BLOCKED] }
            unplannedMissing: { type: integer, minimum: 0, maximum: 100 }
            shoppingCovered: { type: integer, minimum: 0, maximum: 100 }
            verify: { type: integer, minimum: 0, maximum: 100 }
            effectiveGroups: { type: integer, minimum: 0, maximum: 100 }
            source: { $ref: "#/components/schemas/RecommendationSource" }
            sourceTier: { $ref: "#/components/schemas/RecommendationSourceTier" }
            available: { type: integer, minimum: 0, maximum: 100 }
            availableCoverage:
              type: integer
              minimum: 0
              maximum: 10000
              description: Basis points of effective groups confirmed available.
            reasons:
              type: array
              items:
                oneOf:
                  - type: object
                    required: [code, eligible]
                    properties:
                      code: { const: scopeEligible }
                      eligible: { type: boolean }
                  - type: object
                    required: [code, matched, total]
                    properties:
                      code: { const: desiredCoverage }
                      matched: { type: integer, minimum: 0, maximum: 100 }
                      total: { type: integer, minimum: 0, maximum: 100 }
                  - type: object
                    required: [code, available, verify, shoppingCovered, unplannedMissing]
                    properties:
                      code: { const: fulfillment }
                      available: { type: integer, minimum: 0, maximum: 100 }
                      verify: { type: integer, minimum: 0, maximum: 100 }
                      shoppingCovered: { type: integer, minimum: 0, maximum: 100 }
                      unplannedMissing: { type: integer, minimum: 0, maximum: 100 }
                  - type: object
                    required: [code, source]
                    properties:
                      code: { const: source }
                      source: { $ref: "#/components/schemas/RecommendationSource" }
        ingredientReasons:
          type: array
          items:
            type: object
            required: [ingredient, code, expiresOn]
            properties:
              ingredient: { type: string }
              code: { type: string, enum: [AVAILABLE, UNKNOWN, STALE, EXPIRES_TODAY, EXPIRED, OUT, MISSING] }
              expiresOn: { type: [string, "null"], format: date }
        ingredientGroupReasons:
          type: array
          description: Group-level evaluation. Optional groups are excluded unless a required filter promotes them.
          items:
            type: object
            required: [groupId, label, optional, effective, action, code, selectedAlternativeId, alternatives]
            properties:
              groupId: { type: string }
              label: { type: string }
              optional: { type: boolean }
              effective: { type: boolean }
              action: { $ref: "#/components/schemas/IngredientGroupAction" }
              code: { type: string, enum: [AVAILABLE, UNKNOWN, STALE, EXPIRES_TODAY, EXPIRED, OUT, MISSING] }
              selectedAlternativeId: { type: [string, "null"] }
              alternatives:
                type: array
                items:
                  type: object
                  required: [ingredient, code, expiresOn]
                  properties:
                    ingredient: { type: string }
                    code: { type: string, enum: [AVAILABLE, UNKNOWN, STALE, EXPIRES_TODAY, EXPIRED, OUT, MISSING] }
                    expiresOn: { type: [string, "null"], format: date }
        appliedControls:
          type: object
          required: [preferred, required, excluded, ingredientScope, pantryOnly, includeOwn, includeFavoriteRecipes, includeFavoriteAccounts, includeOtherPublic]
          properties:
            preferred: { type: array, items: { type: string } }
            required: { type: array, items: { type: string } }
            excluded: { type: array, items: { type: string } }
            ingredientScope: { type: string, enum: [ANY, PANTRY_ONLY, PANTRY_OR_LIST] }
            pantryOnly:
              type: boolean
              deprecated: true
              description: True only when ingredientScope is PANTRY_ONLY.
            includeOwn: { type: boolean }
            includeFavoriteRecipes: { type: boolean }
            includeFavoriteAccounts: { type: boolean }
            includeOtherPublic: { type: boolean }
    RecommendationSource:
      type: string
      enum: [OWN, FAVORITE_RECIPE, FAVORITE_ACCOUNT, OTHER_PUBLIC]
    RecommendationSourceTier:
      type: string
      enum: [PREFERRED, OTHER_PUBLIC]
      description: OWN, FAVORITE_RECIPE, and FAVORITE_ACCOUNT share the PREFERRED tier; overlapping source labels do not stack.
    IngredientGroupAction:
      type: string
      enum: [AVAILABLE, VERIFY, SHOPPING_PLANNED, MISSING]
    PublicAuthorProfile:
      type: object
      required: [handle, nickname, recipes, nextCursor]
      properties:
        handle: { type: string, pattern: "^[0-9a-f]{32}$" }
        nickname:
          type: [string, "null"]
          description: Opt-in public nickname. Null is rendered as the viewer locale's anonymous label.
        recipes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Recipe" }
        nextCursor: { type: [string, "null"] }
    FavoriteAuthor:
      type: object
      required: [handle, nickname]
      properties:
        handle: { type: string, pattern: "^[0-9a-f]{32}$" }
        nickname: { type: [string, "null"] }
    CreateImportTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresInDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        preset:
          type: string
          enum: [import, manage, publish]
          default: import
          description: import grants only recipes:import. manage grants recipes:read, recipes:write, and recipes:images:write. publish grants the management scopes plus recipes:publish and requires confirmPublishRisk=true. No preset grants recipe deletion.
        confirmPublishRisk:
          type: boolean
          default: false
          description: Must be true to create the high-risk publish preset; ignored for lower-risk presets.
    ImportToken:
      type: object
      required: [id, name, prefix, scopes, createdAt, lastUsedAt, expiresAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Non-secret display prefix }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ["recipes:import", "recipes:read", "recipes:write", "recipes:images:write", "recipes:publish"]
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CreatedImportToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ImportToken" }
        secret:
          type: string
          writeOnly: true
          description: Returned once. Cook stores only its digest.
    AiCapabilities:
      type: object
      additionalProperties: false
      required: [prefix, scopes, expiresAt, preset]
      properties:
        prefix: { type: string, description: Non-secret display prefix }
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: ["recipes:import", "recipes:read", "recipes:write", "recipes:images:write", "recipes:publish"]
        expiresAt: { type: [string, "null"], format: date-time }
        preset:
          type: [string, "null"]
          enum: [import, manage, publish, null]
          description: Present only when the exact scope set matches a standard preset.
    AiRecipeInput:
      type: object
      additionalProperties: false
      required: [title]
      oneOf:
        - required: [ingredients]
          not: { required: [ingredientGroups] }
        - required: [ingredientModel, ingredientGroups]
          not: { required: [ingredients] }
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, default: "" }
        instructions: { type: string, maxLength: 20000, default: "" }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: Estimated total kcal for the whole recipe.
        sourceUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        sourceTitle: { type: [string, "null"], maxLength: 200 }
        sourceAuthor: { type: [string, "null"], maxLength: 200 }
        sourceLicense:
          type: [string, "null"]
          maxLength: 200
          description: License metadata is not independently verified by Cook.
        sourceAttribution: { type: [string, "null"], maxLength: 1000 }
        visibility:
          type: string
          enum: [private, public]
          default: private
          description: Public requires recipes:publish. Omit on update to retain the current visibility.
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
          deprecated: true
        ingredientModel: { type: string, const: groups-v1 }
        ingredientGroups:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/IngredientGroup" }
        expectedVersion:
          type: integer
          minimum: 1
          description: Required for update; omitted for create.
    AiRecipeMutation:
      oneOf:
        - type: object
          required: [status, recipe]
          properties:
            status: { const: updated }
            recipe: { $ref: "#/components/schemas/Recipe" }
        - type: object
          required: [status, revision]
          properties:
            status: { const: pendingReview }
            revision: { $ref: "#/components/schemas/RecipeRevision" }
    RecipeRevision:
      type: object
      required: [id, recipeId, expectedVersion, title, description, instructions, difficulty, estimatedCalories, sourceUrl, sourceTitle, sourceAuthor, sourceLicense, sourceAttribution, ingredientModel, ingredientGroups, ingredients, imageAction, imageAltText, imageUrl, imageSourceUrl, imageSourceLicense, imageSourceAttribution, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        instructions: { type: string }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        sourceUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        sourceTitle: { type: [string, "null"], maxLength: 200 }
        sourceAuthor: { type: [string, "null"], maxLength: 200 }
        sourceLicense: { type: [string, "null"], maxLength: 200 }
        sourceAttribution: { type: [string, "null"], maxLength: 1000 }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
          deprecated: true
        ingredientModel: { type: string, const: groups-v1 }
        ingredientGroups:
          type: array
          items: { $ref: "#/components/schemas/IngredientGroup" }
        imageAction: { type: string, enum: [keep, replace, delete] }
        imageAltText: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        imageSourceUrl: { type: [string, "null"], format: uri }
        imageSourceLicense: { type: [string, "null"] }
        imageSourceAttribution: { type: [string, "null"] }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportDraftSubmission:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceUrl, title, steps]
      oneOf:
        - required: [ingredients]
          not: { required: [ingredientGroups] }
        - required: [ingredientModel, ingredientGroups]
          not: { required: [ingredients] }
      properties:
        schemaVersion: { type: string, enum: ["1.0", "2.0"] }
        sourceUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Must use HTTP or HTTPS and include a host. Cook does not fetch it.
        sourceTitle: { type: [string, "null"], maxLength: 200 }
        sourceAuthor: { type: [string, "null"], maxLength: 200 }
        sourceLicense:
          type: [string, "null"]
          maxLength: 200
          description: License metadata is not independently verified by Cook.
        sourceAttribution: { type: [string, "null"], maxLength: 1000 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, default: "" }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: Estimated total kcal for the whole recipe.
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
          deprecated: true
        ingredientModel: { type: string, const: groups-v1 }
        ingredientGroups:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/IngredientGroup" }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 2000 }
        warnings:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    ImportDraftUpdate:
      type: object
      additionalProperties: false
      required: [title, description, instructions]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        instructions: { type: string, minLength: 1, maxLength: 20000 }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
          deprecated: true
        ingredientModel: { type: string, const: groups-v1 }
        ingredientGroups:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/IngredientGroup" }
    ImportDraft:
      allOf:
        - $ref: "#/components/schemas/ImportDraftUpdate"
        - type: object
          required: [id, sourceUrl, sourceTitle, sourceAuthor, sourceLicense, sourceAttribution, difficulty, estimatedCalories, ingredientModel, ingredientGroups, ingredients, warnings, confidence, status, acceptedRecipeId, reviewUrl, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            sourceUrl: { type: string, format: uri }
            sourceTitle: { type: [string, "null"] }
            sourceAuthor: { type: [string, "null"] }
            sourceLicense: { type: [string, "null"] }
            sourceAttribution: { type: [string, "null"] }
            warnings:
              type: array
              items: { type: string }
            confidence:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            status: { type: string, enum: [draft, consumed, discarded] }
            acceptedRecipeId: { type: [string, "null"], format: uuid }
            reviewUrl: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        recipeVersion: { type: integer, minimum: 1 }
        moderationVersion: { type: integer, minimum: 1 }
        caseVersion: { type: integer, minimum: 1 }
        appealVersion: { type: integer, minimum: 1 }
