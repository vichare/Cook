openapi: 3.1.0
info:
  title: Cook API
  version: 0.3.0
servers:
  - url: https://cook.vichare.net
paths:
  /health:
    get:
      responses:
        "200": { description: Healthy }
  /api/me:
    get:
      responses:
        "200":
          description: Current Cook user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/profile:
    put:
      description: Updates the authenticated user's opt-in public nickname and completes profile onboarding. A null nickname is the locale-independent anonymous state.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated private current-user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: JSON shape contains unsupported or invalid fields }
  /api/settings/locale:
    put:
      description: Persists the authenticated account's authoritative interface locale. New and migrated accounts may initially return null so the browser can initialize this once from the saved local preference or browser languages.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocaleInput" }
      responses:
        "200":
          description: Updated private current-user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/config:
    get:
      responses:
        "200":
          description: Available browser sign-in mode
          content:
            application/json:
              schema:
                type: object
                required: [mode, google, emailOtp, passkey]
                properties:
                  mode: { type: string, enum: [development, production] }
                  google: { type: boolean }
                  emailOtp: { type: boolean }
                  passkey: { type: boolean }
  /api/auth/dev-login:
    post:
      description: Development and test only. Production returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        "200": { description: Development session created }
        "404": { description: Development authentication is disabled }
  /api/auth/google/start:
    get:
      description: Starts backend Google Authorization Code OIDC with S256 PKCE, state, and nonce.
      responses:
        "307":
          description: Redirect to Google and set an HttpOnly OAuth state cookie
        "404": { description: Google authentication is disabled }
        "429": { description: Login start rate limited }
  /api/auth/google/callback:
    get:
      description: Backend-only callback. Authorization codes and tokens are never returned to frontend JavaScript. A new Google identity may attach to an existing Email OTP user only for the exact same normalized gmail.com address; non-Gmail matches and pre-existing split identities fail without merging.
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Cook session issued with a Host-only HttpOnly cookie and browser redirected home, or unsafe identity linking rejected and redirected to a generic recovery message
        "401": { description: Invalid, expired, denied, or replayed login attempt }
        "503": { description: Google or authentication persistence unavailable }
  /api/auth/email/request:
    post:
      description: Starts a non-enumerating Email OTP sign-in. The server does not look up account existence before returning the generic challenge response.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpRequest"
      responses:
        "200":
          description: Generic challenge metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailOtpChallenge" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Email or client-address rate limit exceeded }
        "503": { description: OTP persistence or mail delivery unavailable }
  /api/auth/email/verify:
    post:
      description: Verifies and consumes a one-time challenge, then creates or resolves only the Email OTP identity and issues a Cook session.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpVerify"
      responses:
        "200":
          description: Cook session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid, expired, exhausted, or replayed challenge }
        "429": { description: Challenge or client-address rate limit exceeded }
  /api/auth/passkey/start:
    post:
      description: Starts username-first passkey login for an explicitly linked Email OTP identity. Unknown users and users without credentials share the same unauthorized response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: WebAuthn credential request options; a short-lived HttpOnly ceremony cookie is set.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: Passkey login cannot be started }
        "429": { description: Email or client-address rate limit exceeded }
  /api/auth/passkey/finish:
    post:
      description: Verifies the WebAuthn assertion, atomically updates credential state, and issues a Cook session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Cook session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid, expired, replayed, or failed WebAuthn ceremony }
  /api/auth/logout:
    post:
      responses:
        "204": { description: Current server-side session revoked and cookies cleared }
  /api/auth/logout-all:
    post:
      responses:
        "204": { description: Every active session for the authenticated Cook user revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/security:
    get:
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Explicitly linked email identities and active passkeys for the current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/security/email/request:
    post:
      security:
        - sessionCookie: []
      description: Starts an Email OTP link challenge bound to the current Cook user.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpRequest"
      responses:
        "200":
          description: Generic challenge metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailOtpChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { description: A Google-first account supplied an email other than its verified Google email }
        "429": { description: Email or client-address rate limit exceeded }
  /api/settings/security/email/verify:
    post:
      security:
        - sessionCookie: []
      description: Consumes a link challenge only for the Cook user who started it. Google-first accounts must verify the exact normalized email stored on their Google identity. Existing ownership by another account returns conflict and never merges accounts.
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpVerify"
      responses:
        "200":
          description: Updated account security settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { description: Invalid, expired, exhausted, replayed, or wrong-user challenge }
        "409": { description: Email identity is already linked to another Cook account }
  /api/settings/security/passkeys/register/start:
    post:
      security:
        - sessionCookie: []
      description: Starts passkey registration for an authenticated account with an explicitly linked email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: WebAuthn credential creation options; a short-lived HttpOnly ceremony cookie is set.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: No linked email or invalid credential name }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/security/passkeys/register/finish:
    post:
      security:
        - sessionCookie: []
      description: Verifies and stores a globally unique passkey credential for the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Passkey registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "401": { description: Invalid, expired, replayed, or wrong-user ceremony }
        "409": { description: Credential ID already belongs to an account }
  /api/settings/security/passkeys/{id}:
    delete:
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Current user's passkey revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Passkey missing or owned by another account }
  /api/recipes:
    get:
      responses:
        "200":
          description: Owned recipes and other users' public recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
    post:
      requestBody:
        $ref: "#/components/requestBodies/RecipeInput"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
  /api/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      responses:
        "200":
          description: Owned or public recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "404": { description: Missing or not visible }
    put:
      description: Owner-only optimistic update. The current recipe version is required so browser and AI edits cannot silently overwrite one another.
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
      requestBody:
        $ref: "#/components/requestBodies/RecipeInput"
      responses:
        "200": { description: Recipe updated }
        "409": { description: Recipe version changed; reload and compare before retrying }
        "404": { description: Missing or not owned }
    delete:
      description: Owner only
      responses:
        "204": { description: Recipe deleted }
        "404": { description: Missing or not owned }
  /api/recipes/{id}/favorite:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    put:
      responses:
        "204": { description: Favorited }
    delete:
      responses:
        "204": { description: Unfavorited }
  /api/pantry:
    get:
      responses:
        "200":
          description: Current account pantry only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PantryItem" }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/PantryItemInput" }
      responses:
        "200": { description: Updated account pantry }
  /api/shopping-list:
    get:
      responses:
        "200":
          description: Current account shopping list, including derived automatic restock items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShoppingItem" }
    post:
      description: Add or reactivate a private manual shopping item. Canonical and normalized duplicates merge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemInput" }
      responses:
        "201": { description: Updated private shopping list }
  /api/shopping-list/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      description: Edit an item that has a manual source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemInput" }
      responses:
        "200": { description: Updated private shopping list }
        "404": { description: Missing, cross-account, or not manually editable }
    delete:
      description: Remove only the manual source. Recipe and automatic sources remain.
      responses:
        "200": { description: Updated private shopping list }
        "404": { description: Missing, cross-account, or no manual source }
  /api/shopping-list/{id}/complete:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      description: Complete a manual item. Active automatic restock items must use the purchased action instead.
      responses:
        "200": { description: Updated private shopping list }
        "400": { description: Item is still derived from an out-of-stock opted-in pantry item }
        "404": { description: Missing, cross-account, or no manual source }
  /api/shopping-list/automatic/{pantryItemId}/purchased:
    parameters:
      - in: path
        name: pantryItemId
        required: true
        schema: { type: string, format: uuid }
    post:
      description: Transactionally mark the owned pantry item available, refresh confirmation time, complete a merged persisted shopping item, and remove the derived automatic item.
      responses:
        "200": { description: Updated private shopping list }
        "404": { description: Pantry item is missing, cross-account, not out, or not opted into automatic restock }
  /api/recipes/{id}/shopping-list-items:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      description: Add a verified ingredient from an owned or public visible recipe to the current account's private shopping list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemInput" }
      responses:
        "201": { description: Updated private shopping list }
        "404": { description: Recipe or ingredient is not visible or does not match the recipe }
  /api/authors/{handle}:
    parameters:
      - in: path
        name: handle
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    get:
      description: Public author profile containing only the immutable random handle, optional public nickname, and public recipes. Authentication identities and internal user IDs are never returned.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Stable keyset-paginated public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAuthorProfile" }
        "404": { description: Unknown author handle }
  /api/authors/{handle}/favorite:
    parameters:
      - in: path
        name: handle
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    put:
      description: Privately favorite another account. Self-favorites are rejected.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Favorite relationship exists }
        "400": { description: Self-favorite rejected }
        "404": { description: Unknown author handle }
    delete:
      description: Remove the current account's private favorite relationship.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Favorite relationship removed or absent }
        "404": { description: Unknown author handle }
  /api/favorite-accounts:
    get:
      description: Lists only the current account's favorite public authors.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Favorite authors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FavoriteAuthor" }
  /api/ingredients/suggestions:
    get:
      description: Returns ranked ingredient candidates visible to the current account. Fuzzy results are advisory and are never applied to hard recommendation matching without explicit selection.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Exact, confirmed-alias, prefix, substring, and bounded-fuzzy candidates in rank order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IngredientSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/recommendations:
    get:
      responses:
        "200":
          description: Current account recommendation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationSettings" }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationSettings" }
      responses:
        "200": { description: Settings saved }
  /api/recommendations:
    post:
      parameters:
        - in: query
          name: limit
          description: Maximum ranked recipes returned. Candidate scanning remains complete so the highest-scoring results are not missed.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: Bounded deterministic top-N recommendations with ingredient explanations
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/Recommendation" }
        "429": { description: Per-account/IP recommendation request limit exceeded }
  /api/settings/import-tokens:
    get:
      description: Lists non-secret metadata and scopes for the authenticated user's AI tokens. Token secrets are never returned.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Import token metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      description: Creates either the minimal recipes:import token or a private-recipe management token. The secret is returned exactly once.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateImportTokenInput" }
      responses:
        "201":
          description: One-time token secret and persistent metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedImportToken" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: JSON shape contains unsupported or invalid fields }
  /api/settings/import-tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/ImportTokenId"
    delete:
      description: Revokes an import token owned by the authenticated user.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Token revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
  /api/recipes/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      description: Replaces the authenticated owner's single cover image. JPEG, PNG, and WebP are decoded under resource limits, orientation-corrected, resized to at most 1600px, metadata-stripped, and re-encoded as JPEG.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RecipeImageUpload" }
      responses:
        "200":
          description: Cover image replaced and recipe version incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version changed }
        "413": { description: Upload, decoded pixels, decoder allocation, or normalized bytes exceed the documented limit }
    put:
      description: Updates alt text and optional source/license/attribution for the authenticated owner's existing cover.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeImageMetadata" }
      responses:
        "200":
          description: Cover metadata updated and recipe version incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Recipe or cover missing or not owned }
        "409": { description: Recipe version changed }
    delete:
      description: Removes the authenticated owner's cover image without deleting the recipe.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeIfMatch"
      responses:
        "200":
          description: Cover image removed and recipe version incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version changed }
  /api/recipe-images/{id}:
    get:
      description: Returns a normalized JPEG by random image ID. Public recipe images require cache revalidation on reuse so unpublish/delete can return 404; private images require the owner session or an owner token with recipes:read and use private, no-store caching.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - {}
        - sessionCookie: []
        - importBearer: []
      responses:
        "200":
          description: Normalized cover bytes with ETag, Content-Length, nosniff, and visibility-appropriate Cache-Control
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304": { description: ETag matched }
        "401": { description: A supplied Bearer token is invalid, expired, or revoked }
        "404": { description: Image missing or private image not owned }
  /api/ai/recipes:
    get:
      description: Lists only recipes owned by the token principal. Requires recipes:read.
      security:
        - importBearer: []
      responses:
        "200":
          description: Owned recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      description: Creates a recipe for the token principal. The default visibility is private; public requires recipes:publish in addition to recipes:write. An Idempotency-Key is required, and retries with the same token/key return the original recipe.
      security:
        - importBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRecipeInput" }
            example:
              title: Tomato noodles
              description: A private weeknight recipe.
              instructions: Boil the noodles, cook the tomatoes, and combine.
              ingredients:
                - name: noodles
                  quantityNote: 200 g
                - name: tomato
                  quantityNote: 3
      responses:
        "201": { description: Recipe created, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "200": { description: Idempotent replay of the original creation, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: Token rate limit exceeded }
  /api/ai/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      description: Reads an owned recipe. Cross-account IDs return 404. Requires recipes:read.
      security:
        - importBearer: []
      responses:
        "200": { description: Owned recipe, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
    put:
      description: Optimistically updates an owned recipe. Without recipes:publish, public recipe changes create a pending owner-reviewed revision. With recipes:publish, the token may publish an owned private recipe or directly update an owned public recipe; stale versions still return 409.
      security:
        - importBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRecipeInput" }
            example:
              title: Tomato noodles
              description: Updated after the user's feedback.
              instructions: Boil the noodles, simmer the tomatoes, and combine.
              ingredients:
                - name: noodles
                  quantityNote: 200 g
                - name: tomato
                  quantityNote: 4
              expectedVersion: 3
      responses:
        "200": { description: Direct owned update or pending public revision, depending on scopes, content: { application/json: { schema: { $ref: "#/components/schemas/AiRecipeMutation" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version is stale or a pending revision already exists }
  /api/ai/recipes/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      - $ref: "#/components/parameters/RecipeVersion"
    post:
      description: Replaces an owned recipe cover. Requires recipes:images:write. Public covers create a pending revision unless the token also has recipes:publish, in which case the live cover changes directly.
      security:
        - importBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RecipeImageUpload" }
      responses:
        "200": { description: Direct owned image update or pending public revision, depending on scopes, content: { application/json: { schema: { $ref: "#/components/schemas/AiRecipeMutation" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version is stale or a pending revision already exists }
        "413": { description: Image resource limit exceeded }
    delete:
      description: Removes an owned cover. Public cover removal creates a pending revision unless the token also has recipes:publish. Recipe deletion is not supported.
      security:
        - importBearer: []
      responses:
        "200": { description: Direct owned image removal or pending public revision, depending on scopes, content: { application/json: { schema: { $ref: "#/components/schemas/AiRecipeMutation" } } } }
        "401": { description: Invalid, expired, or revoked token }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Recipe missing or not owned }
        "409": { description: Recipe version is stale or a pending revision already exists }
  /api/recipe-revisions:
    get:
      description: Lists pending AI revisions owned by the authenticated user.
      security:
        - sessionCookie: []
      parameters:
        - name: recipeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pending revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/recipe-revisions/{id}/accept:
    post:
      description: Atomically applies an owned pending revision only when the live recipe version still matches, then marks the revision accepted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeRevisionId"
      responses:
        "200": { description: Updated live recipe, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Revision missing or not owned }
        "409": { description: Live recipe changed after the revision was created }
  /api/recipe-revisions/{id}/cover:
    get:
      description: Returns the normalized proposed cover for an owned pending replacement revision. Never public and always private, no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeRevisionId"
      responses:
        "200":
          description: Proposed normalized JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Revision image missing or not owned }
  /api/recipe-revisions/{id}:
    delete:
      description: Rejects an owned pending revision without changing the live recipe.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecipeRevisionId"
      responses:
        "204": { description: Revision rejected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Revision missing or not owned }
  /api/import/drafts:
    post:
      description: Token-only endpoint used by the official AI-client skill. The owner is derived from the token; the server does not fetch sourceUrl. Creates a private review draft, not a recipe.
      security:
        - importBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportDraftSubmission" }
            examples:
              browserExtraction:
                value:
                  schemaVersion: "1.0"
                  sourceUrl: https://example.com/recipes/tomato-pasta
                  sourceTitle: Tomato pasta
                  sourceAuthor: Example Kitchen
                  title: Tomato pasta
                  description: A concise summary rewritten from the source.
                  ingredients:
                    - name: pasta
                      quantityNote: 200 g
                    - name: tomato
                      quantityNote: 3
                  steps:
                    - Boil the pasta until tender.
                    - Cook the tomatoes into a sauce and combine.
                  warnings:
                    - The source did not specify the amount of salt.
                  confidence: 0.86
      responses:
        "201":
          description: Private draft ready for authenticated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Missing, invalid, expired, revoked, or incorrectly scoped import token }
        "429": { description: Per-token rate limit or per-account active-draft quota exceeded }
        "422": { description: JSON shape contains unsupported or invalid fields }
  /api/import-drafts:
    get:
      description: Lists the authenticated user's own import drafts.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Owner-scoped drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/import-drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/ImportDraftId"
    get:
      description: Returns one import draft owned by the authenticated user.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Import draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
    put:
      description: Edits a pending import draft owned by the authenticated user.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportDraftUpdate" }
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
        "409": { description: Draft has already been consumed or discarded }
        "422": { description: JSON shape contains unsupported or invalid fields }
    delete:
      description: Discards a pending import draft owned by the authenticated user.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Draft discarded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing, not owned, or no longer pending }
  /api/import-drafts/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/ImportDraftId"
    post:
      description: Transactionally creates a private recipe and consumes the draft exactly once.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Private recipe created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Missing or not owned }
        "409": { description: Draft has already been consumed or discarded }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cook_session
    importBearer:
      type: http
      scheme: bearer
      bearerFormat: cook_imp
      description: Scoped Cook AI token. The endpoint enforces recipes:import, recipes:read, recipes:write, recipes:images:write, or recipes:publish as documented.
  parameters:
    RecipeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong recipe version validator in the form `"recipe-v<version>"`.
      schema:
        type: string
        pattern: '^"recipe-v[1-9][0-9]*"$'
    ImportTokenId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportDraftId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeRevisionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    RecipeVersion:
      name: If-Match
      in: header
      required: true
      description: Current live recipe version using the exact form "recipe-v<version>" including quotes.
      schema: { type: string, pattern: '^"recipe-v[1-9][0-9]*"$' }
  responses:
    Unauthorized:
      description: Host-only Cook session is absent or invalid
    ValidationError:
      description: Request failed server-side validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Token is valid but lacks the required scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  requestBodies:
    RecipeInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecipeInput" }
    EmailOtpRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string, format: email }
    EmailOtpVerify:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challengeId, code]
            properties:
              challengeId:
                type: string
                description: Opaque 256-bit challenge identifier; never place it or the code in URLs or logs.
              code: { type: string, pattern: "^[0-9]{6}$" }
  schemas:
    User:
      type: object
      description: Private current-user DTO. It is never embedded as another recipe author's public profile.
      required: [id, email, displayName, nickname, onboardingCompleted, locale]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        nickname: { type: [string, "null"], maxLength: 40 }
        onboardingCompleted: { type: boolean }
        locale:
          type: [string, "null"]
          enum: [en, zh-CN, null]
          description: Account-level interface locale. Null is an initialization state only, not a translated anonymous value.
    ProfileInput:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: [string, "null"]
          maxLength: 40
          description: Null selects anonymous. Values are trimmed and may not contain control characters, unusual whitespace, or repeated spaces.
    LocaleInput:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale: { type: string, enum: [en, zh-CN] }
    EmailOtpChallenge:
      type: object
      required: [challengeId, expiresAt, resendAllowedAt]
      properties:
        challengeId: { type: string }
        expiresAt: { type: string, format: date-time }
        resendAllowedAt: { type: string, format: date-time }
    Passkey:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
    SecuritySettings:
      type: object
      required: [linkedEmails, googleEmail, googleSignInStatus, passkeys]
      properties:
        linkedEmails:
          type: array
          items: { type: string, format: email }
        googleEmail:
          type: [string, "null"]
          format: email
          description: Current user's private Google verified email, if linked. Never exposed in public author DTOs.
        googleSignInStatus:
          type: string
          enum: [linked, eligible, unsupported, unavailable]
          description: Whether Google is already linked, may be added by exact Gmail match, is unsupported for a non-Gmail email-first account, or lacks an email identity.
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
    Ingredient:
      type: object
      required: [name, quantityNote]
      properties:
        name:
          type: string
          minLength: 1
          description: A pasted delimiter-separated list is accepted on write; each resulting ingredient name is limited to 120 characters.
        quantityNote: { type: string, maxLength: 240 }
        canonicalIngredientId:
          type: [string, "null"]
          description: Canonical identity selected explicitly by the user. Omit or send null to keep the normalized input without alias binding.
    RecipeInput:
      type: object
      required: [title, description, instructions, visibility, ingredients]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description:
          type: string
          maxLength: 2000
          description: Markdown source. Raw HTML and embedded images are not rendered by Cook.
        instructions:
          type: string
          maxLength: 20000
          description: Markdown source. Raw HTML and embedded images are not rendered by Cook.
        visibility: { type: string, enum: [private, public], default: private }
        difficulty:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Optional whole-recipe difficulty aligned with the 1–5 source scale.
        estimatedCalories:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: Optional estimated total kcal for the whole recipe, not per serving or medical nutrition data.
        ingredients:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Ingredient" }
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          required: [id, version, isOwner, authorHandle, authorNickname, difficulty, estimatedCalories, isFavorite, isFavoriteAuthor, source, coverImage]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            isOwner: { type: boolean }
            authorHandle:
              type: string
              pattern: "^[0-9a-f]{32}$"
              description: Immutable random public handle unrelated to internal IDs or authentication identities.
            authorNickname:
              type: [string, "null"]
              description: Opt-in public nickname. Null must be rendered as the locale's anonymous label.
            isFavorite: { type: boolean }
            isFavoriteAuthor: { type: boolean }
            source:
              oneOf:
                - $ref: "#/components/schemas/RecipeSource"
                - type: "null"
            coverImage:
              oneOf:
                - $ref: "#/components/schemas/RecipeImage"
                - type: "null"
    RecipeVersion:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 2 }
    RecipeImage:
      type: object
      required: [id, url, width, height, altText, sourceUrl, sourceLicense, sourceAttribution, version]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        width: { type: integer, minimum: 1, maximum: 1600 }
        height: { type: integer, minimum: 1, maximum: 1600 }
        altText: { type: string, minLength: 1, maxLength: 300 }
        sourceUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        sourceLicense: { type: [string, "null"], maxLength: 120 }
        sourceAttribution: { type: [string, "null"], maxLength: 500 }
        version: { type: integer, minimum: 1 }
    RecipeImageMetadata:
      type: object
      additionalProperties: false
      required: [altText]
      properties:
        altText: { type: string, minLength: 1, maxLength: 300 }
        sourceUrl:
          oneOf:
            - { type: string, const: "" }
            - { type: string, format: uri, maxLength: 2048 }
        sourceLicense: { type: string, maxLength: 120, default: "" }
        sourceAttribution: { type: string, maxLength: 500, default: "" }
    RecipeImageUpload:
      type: object
      required: [image, altText]
      properties:
        image:
          type: string
          format: binary
          description: JPEG, PNG, or WebP only; at most 8 MiB request file, 20 megapixels, 10000px decoder dimensions, 128 MiB decoder allocation, and 2.5 MB normalized storage.
        altText: { type: string, minLength: 1, maxLength: 300 }
        sourceUrl: { type: string, format: uri, maxLength: 2048 }
        sourceLicense: { type: string, maxLength: 120 }
        sourceAttribution: { type: string, maxLength: 500 }
    RecipeSource:
      type: object
      required: [url, title, author, warnings, confidence]
      properties:
        url: { type: string, format: uri }
        title: { type: [string, "null"] }
        author: { type: [string, "null"] }
        warnings:
          type: array
          items: { type: string }
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    PantryItemInput:
      type: object
      required: [name, status, quantityNote]
      properties:
        name:
          type: string
          description: May contain a comma, full-width comma, Chinese enumeration comma, semicolon, full-width semicolon, or newline separated list. The server NFKC-normalizes and deduplicates entries; each resulting name is limited to 120 characters.
        status: { type: string, enum: [have, out, unknown] }
        quantityNote: { type: string, maxLength: 240 }
        expiresOn:
          type: [string, "null"]
          format: date
          description: Date-only pantry expiration. Omit to preserve the current value; send null to clear it.
        canonicalIngredientId:
          type: [string, "null"]
          description: Canonical identity selected explicitly by the user.
        autoAddToShoppingListWhenOut:
          type: boolean
          description: Omit to preserve the current value. When true, only an explicit out status derives an automatic shopping item.
    PantryItem:
      allOf:
        - $ref: "#/components/schemas/PantryItemInput"
        - type: object
          required: [id, expiresOn, canonicalIngredientId, autoAddToShoppingListWhenOut]
          properties:
            id: { type: string, format: uuid }
            confirmedAt: { type: [string, "null"], format: date-time }
    ShoppingItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        canonicalIngredientId:
          type: [string, "null"]
          description: Canonical identity selected explicitly by the user. Similar or fuzzy candidates are not inferred.
    ShoppingItemSource:
      type: object
      required: [kind, label, recipeId]
      properties:
        kind: { type: string, enum: [automatic, manual, recipe] }
        label: { type: string }
        recipeId: { type: [string, "null"], format: uuid }
    ShoppingItem:
      type: object
      required: [id, name, canonicalIngredientId, automatic, completedAt, pantryItemId, sources]
      properties:
        id:
          type: string
          description: UUID for persisted items or an opaque auto-prefixed identifier for a purely derived item.
        name: { type: string }
        canonicalIngredientId: { type: [string, "null"] }
        automatic: { type: boolean }
        completedAt: { type: [string, "null"], format: date-time }
        pantryItemId: { type: [string, "null"], format: uuid }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItemSource" }
    IngredientReference:
      oneOf:
        - type: string
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              description: May contain a supported delimiter-separated list; each resulting name is limited to 120 characters.
            canonicalIngredientId: { type: [string, "null"] }
      description: Legacy strings remain accepted. Structured references preserve an explicit canonical selection; fuzzy suggestions are never inferred here.
    IngredientSuggestion:
      type: object
      required: [canonicalIngredientId, displayName, matchedText, reason]
      properties:
        canonicalIngredientId: { type: string }
        displayName: { type: string }
        matchedText: { type: string }
        reason: { type: string, enum: [exact, alias, prefix, substring, similar] }
    RecommendationSettings:
      type: object
      required: [includeFavoriteRecipes, includeOwn, includeFavoriteAccounts, includeOtherPublic, verificationDays]
      properties:
        includeFavoriteRecipes: { type: boolean }
        includeOwn: { type: boolean }
        includeFavoriteAccounts: { type: boolean, default: true }
        includeOtherPublic: { type: boolean }
        verificationDays: { type: integer, minimum: 1, maximum: 90 }
    RecommendationRequest:
      type: object
      properties:
        preferred: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/IngredientReference" } }
        required: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/IngredientReference" } }
        excluded: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/IngredientReference" } }
        pantryOnly: { type: boolean }
        today:
          type: string
          format: date
          description: User-local calendar date used for date-only expiration classification. The server UTC date is used when omitted.
    Recommendation:
      type: object
      required: [recipe, status, available, verify, missing, reasons, reasonDetails, score, scoreBreakdown, primarySource, matchedSources, desiredMatches, ingredientReasons, appliedControls]
      properties:
        recipe: { $ref: "#/components/schemas/Recipe" }
        status: { type: string, enum: [READY, VERIFY, SHOP, BLOCKED] }
        available: { type: array, items: { type: string } }
        verify: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        reasons:
          type: array
          items: { type: string }
          deprecated: true
          description: Legacy English explanations retained for compatibility. New clients should localize reasonDetails.
        reasonDetails:
          type: array
          items:
            oneOf:
              - type: object
                required: [code, confirmed, total]
                properties:
                  code: { const: confirmedIngredients }
                  confirmed: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0 }
              - type: object
                required: [code, count]
                properties:
                  code: { const: preferredIngredients }
                  count: { type: integer, minimum: 1 }
              - type: object
                required: [code, ingredient, expiresOn]
                properties:
                  code: { const: ingredientExpired }
                  ingredient: { type: string }
                  expiresOn: { type: string, format: date }
              - type: object
                required: [code, ingredient]
                properties:
                  code: { const: ingredientExpiresToday }
                  ingredient: { type: string }
              - type: object
                required: [code]
                properties:
                  code: { const: pantryOnlyBlocked }
        score: { type: integer }
        scoreBreakdown:
          type: object
          required: [statusBase, source, availability, desired, certainty, simplicity]
          properties:
            statusBase: { type: integer, enum: [0, 250, 500, 750] }
            source: { type: integer, minimum: 0, maximum: 100 }
            availability:
              type: integer
              minimum: 0
              maximum: 80
              description: Confirmed-available recipe-ingredient coverage scaled to 80.
            desired:
              type: integer
              minimum: 0
              maximum: 40
              description: Requested desired-ingredient hit coverage scaled to 40; zero when no desired ingredients were requested.
            certainty:
              type: integer
              minimum: 0
              maximum: 20
              description: Confirmed, unexpired recipe-ingredient share scaled to 20.
            simplicity:
              type: integer
              minimum: 0
              maximum: 9
              description: Nine minus the missing ingredient count, bounded to this range.
        primarySource: { $ref: "#/components/schemas/RecommendationSource" }
        matchedSources:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/RecommendationSource" }
        desiredMatches: { type: array, items: { type: string } }
        ingredientReasons:
          type: array
          items:
            type: object
            required: [ingredient, code, expiresOn]
            properties:
              ingredient: { type: string }
              code: { type: string, enum: [AVAILABLE, UNKNOWN, STALE, EXPIRES_TODAY, EXPIRED, OUT, MISSING] }
              expiresOn: { type: [string, "null"], format: date }
        appliedControls:
          type: object
          required: [preferred, required, excluded, pantryOnly, includeOwn, includeFavoriteRecipes, includeFavoriteAccounts, includeOtherPublic]
          properties:
            preferred: { type: array, items: { type: string } }
            required: { type: array, items: { type: string } }
            excluded: { type: array, items: { type: string } }
            pantryOnly: { type: boolean }
            includeOwn: { type: boolean }
            includeFavoriteRecipes: { type: boolean }
            includeFavoriteAccounts: { type: boolean }
            includeOtherPublic: { type: boolean }
    RecommendationSource:
      type: string
      enum: [OWN, FAVORITE_RECIPE, FAVORITE_ACCOUNT, OTHER_PUBLIC]
    PublicAuthorProfile:
      type: object
      required: [handle, nickname, recipes, nextCursor]
      properties:
        handle: { type: string, pattern: "^[0-9a-f]{32}$" }
        nickname:
          type: [string, "null"]
          description: Opt-in public nickname. Null is rendered as the viewer locale's anonymous label.
        recipes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Recipe" }
        nextCursor: { type: [string, "null"] }
    FavoriteAuthor:
      type: object
      required: [handle, nickname]
      properties:
        handle: { type: string, pattern: "^[0-9a-f]{32}$" }
        nickname: { type: [string, "null"] }
    CreateImportTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresInDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        preset:
          type: string
          enum: [import, manage, publish]
          default: import
          description: import grants only recipes:import. manage grants recipes:read, recipes:write, and recipes:images:write. publish grants the management scopes plus recipes:publish and requires confirmPublishRisk=true. No preset grants recipe deletion.
        confirmPublishRisk:
          type: boolean
          default: false
          description: Must be true to create the high-risk publish preset; ignored for lower-risk presets.
    ImportToken:
      type: object
      required: [id, name, prefix, scopes, createdAt, lastUsedAt, expiresAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Non-secret display prefix }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ["recipes:import", "recipes:read", "recipes:write", "recipes:images:write", "recipes:publish"]
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CreatedImportToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ImportToken" }
        secret:
          type: string
          writeOnly: true
          description: Returned once. Cook stores only its digest.
    AiRecipeInput:
      type: object
      additionalProperties: false
      required: [title, ingredients]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, default: "" }
        instructions: { type: string, maxLength: 20000, default: "" }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: Estimated total kcal for the whole recipe.
        visibility:
          type: string
          enum: [private, public]
          default: private
          description: Public requires recipes:publish. Omit on update to retain the current visibility.
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
        expectedVersion:
          type: integer
          minimum: 1
          description: Required for update; omitted for create.
    AiRecipeMutation:
      oneOf:
        - type: object
          required: [status, recipe]
          properties:
            status: { const: updated }
            recipe: { $ref: "#/components/schemas/Recipe" }
        - type: object
          required: [status, revision]
          properties:
            status: { const: pendingReview }
            revision: { $ref: "#/components/schemas/RecipeRevision" }
    RecipeRevision:
      type: object
      required: [id, recipeId, expectedVersion, title, description, instructions, difficulty, estimatedCalories, ingredients, imageAction, imageAltText, imageUrl, imageSourceUrl, imageSourceLicense, imageSourceAttribution, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        instructions: { type: string }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        imageAction: { type: string, enum: [keep, replace, delete] }
        imageAltText: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        imageSourceUrl: { type: [string, "null"], format: uri }
        imageSourceLicense: { type: [string, "null"] }
        imageSourceAttribution: { type: [string, "null"] }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportDraftSubmission:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceUrl, title, ingredients, steps]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        sourceUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Must use HTTP or HTTPS and include a host. Cook does not fetch it.
        sourceTitle: { type: [string, "null"], maxLength: 200 }
        sourceAuthor: { type: [string, "null"], maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, default: "" }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: Estimated total kcal for the whole recipe.
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 2000 }
        warnings:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    ImportDraftUpdate:
      type: object
      additionalProperties: false
      required: [title, description, instructions, ingredients]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        instructions: { type: string, minLength: 1, maxLength: 20000 }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 5 }
        estimatedCalories: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Ingredient" }
    ImportDraft:
      allOf:
        - $ref: "#/components/schemas/ImportDraftUpdate"
        - type: object
          required: [id, sourceUrl, sourceTitle, sourceAuthor, difficulty, estimatedCalories, warnings, confidence, status, acceptedRecipeId, reviewUrl, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            sourceUrl: { type: string, format: uri }
            sourceTitle: { type: [string, "null"] }
            sourceAuthor: { type: [string, "null"] }
            warnings:
              type: array
              items: { type: string }
            confidence:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            status: { type: string, enum: [draft, consumed, discarded] }
            acceptedRecipeId: { type: [string, "null"], format: uuid }
            reviewUrl: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
