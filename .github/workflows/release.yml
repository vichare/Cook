name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: cook-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release tag and main ancestry
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'
          git fetch origin main
          release_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main

  backend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deployment-files:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          shellcheck deploy/*.sh deploy/tests/*.sh
          for script in deploy/*.sh deploy/tests/*.sh; do sh -n "$script"; done
      - name: Test deployment scripts
        run: deploy/tests/upgrade_test.sh
      - name: Validate production Compose
        run: |
          cp deploy/.env.example deploy/.env
          printf '\nCOOK_IMAGE=ghcr.io/vichare/cook:v0.0.0\n' >> deploy/.env
          docker compose -f deploy/compose.yaml config --quiet
          rm deploy/.env

  image:
    needs: [backend, frontend, deployment-files]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vichare/cook:${{ github.ref_name }}
            ghcr.io/vichare/cook:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      release: ${{ github.ref_name }}
    secrets: inherit
